name: CI WebScout SCLM

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: webscout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore WebScout.slnx

      - name: Compilar solución (Release)
        run: dotnet build WebScout.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas unitarias y de arquitectura
        run: |
          dotnet test tests/WebScout.ArchitectureTests/WebScout.ArchitectureTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/WebScout.WebTests/WebScout.WebTests.csproj --configuration Release --no-build --verbosity normal

      - name: Ejecutar pruebas de integración
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=webscout_test;Username=postgres;Password=postgrespassword"
        run: dotnet test tests/WebScout.IntegrationTests/WebScout.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
